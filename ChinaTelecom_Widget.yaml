name: "中国运营商"
description: "中国电信 - 中国联通话费流量小组件"
author: iBL3ND
icon: https://iili.io/nEq2mpn.th.png
# 中国联通直接打开App就可以
# 中国电信用这个链接去登录 https://e.dlife.cn

scriptings:
  # 电信
  - generic:
      name: "china-telecom"
      script_url: "https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CT_Widget.JS"

  - http_request:
      name: "中国电信自动捕获"
      match: '^https://e\.dlife\.cn/'
      script_url: "https://raw.githubusercontent.com/IBL3ND/js/refs/heads/main/ChinaTelecom.js"

  # 联通
  - generic:
      name: "china-unicom"
      script_url: "https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Unicom_Widget.JS"

  - http_request:
      name: "中国联通 App 自动捕获"
      match: '^https://m\.client\.10010\.com/'
      script_url: "https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Unicom_Widget.JS"
mitm:
  hostnames:
    includes:
      - e.dlife.cn
      - m.client.10010.com
widgets:
  - name: "china-telecom"
  - name: "china-unicom"