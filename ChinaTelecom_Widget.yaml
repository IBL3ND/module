name: 中国电信小组件
description: 中国电信 话费 语音 流量小组件（含定时保活）
author: iBL3ND
icon: https://iili.io/nEufFXR.png
compat_arguments:
  ctCapture: 'true'
compat_arguments_schema:
  ctCapture:
    name: 中国电信数据抓取
    description: 用这个链接去登录 https://e.dlife.cn（抓到数据后可以关闭）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
dns: {}
scriptings:
- generic:
    name: china-telecom
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CT_Widget.JS
- http_request:
    name: 中国电信自动捕获
    match: '^https://e\.dli[^{{{ctCapture}}}]e\.cn/'
    script_url: https://raw.githubusercontent.com/IBL3ND/js/refs/heads/main/ChinaTelecom.js
- schedule:
    name: 中国电信保活
    cron: '*/20 * * * *'
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CT_Widget.JS
mitm:
  hostnames:
    includes:
    - e.dlife.cn
widgets:
- name: china-telecom
