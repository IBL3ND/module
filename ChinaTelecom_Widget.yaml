name: 中国运营商
description: 中国电信 - 中国联通 话费 语音 流量小组件
author: iBL3ND
icon: https://iili.io/nEq2mpn.th.png
compat_arguments:
  ctCapture: 'true'
  cuCapture: 'true'
compat_arguments_schema:
  ctCapture:
    name: 中国电信数据抓取
    description: 用这个链接去登录 https://e.dlife.cn（抓到数据后可以关闭）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuCapture:
    name: 中国联通数据抓取
    description: 直接打开 App 就可以（抓到数据后可以关闭）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
dns: {}
scriptings:
- generic:
    name: china-telecom
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CT_Widget.JS
- http_request:
    name: 中国电信自动捕获
    match: '^https://e\.dli[^{{{ctCapture}}}]e\.cn/'
    script_url: https://raw.githubusercontent.com/IBL3ND/js/refs/heads/main/ChinaTelecom.js
- generic:
    name: china-unicom
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Unicom_Widget.JS
- http_request:
    name: 中国联通 App 自动捕获
    match: '^https://m\.clien[{{{cuCapture}}}]\.10010\.com/'
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Unicom_Widget.JS
mitm:
  hostnames:
    includes:
    - e.dlife.cn
    - m.client.10010.com
widgets:
- name: china-telecom
- name: china-unicom
