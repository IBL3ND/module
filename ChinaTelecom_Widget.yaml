name: 中国电信小组件
description: 中国电信 话费 语音 流量小组件（含定时保活）
author: iBL3ND
icon: https://iili.io/nEufFXR.png
compat_arguments:
  ctCapture: 'true'
  ctShowUsedFlow: 'false'
  ctShowUsedVoice: 'false'
  ctShowDirect: 'auto'
  ctTitle: ''
compat_arguments_schema:
  ctCapture:
    name: 中国电信数据抓取
    description: 用这个链接去登录 https://e.dlife.cn（抓到数据后可以关闭）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowUsedFlow:
    name: 显示已用流量
    description: 开启显示已用流量，关闭显示剩余流量
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctShowUsedVoice:
    name: 显示已用语音
    description: 开启显示已用语音，关闭显示剩余语音
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctShowDirect:
    name: 定向流量卡
    description: auto=自动判断，true=强制显示，false=隐藏
    default_value: 'auto'
    options:
    - 'auto'
    - 'true'
    - 'false'
  ctTitle:
    name: 小组件标题
    description: 默认"中国电信"，可自定义
    default_value: ''
dns: {}
scriptings:
- generic:
    name: china-telecom
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CT_Widget.JS
    env:
      CT_SHOW_USED_FLOW: '{{{ctShowUsedFlow}}}'
      CT_SHOW_USED_VOICE: '{{{ctShowUsedVoice}}}'
      CT_SHOW_DIRECT: '{{{ctShowDirect}}}'
      CT_TITLE: '{{{ctTitle}}}'
- http_request:
    name: 中国电信自动捕获
    match: '^https://e\.dli[{{{ctCapture}}}]e\.cn/'
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CT_Widget.JS
- schedule:
    name: 中国电信保活
    cron: '*/20 * * * *'
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CT_Widget.JS
mitm:
  hostnames:
    includes:
    - e.dlife.cn
widgets:
- name: china-telecom
