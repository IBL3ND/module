name: 中国联通小组件
description: 中国联通 话费 语音 流量小组件
author: iBL3ND
icon: https://iili.io/nEuB6Jt.png
compat_arguments:
  cuCapture: 'true'
compat_arguments_schema:
  cuCapture:
    name: 中国联通数据抓取
    description: 直接打开 App 就可以（抓到数据后可以关闭）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
dns: {}
scriptings:
- generic:
    name: china-unicom
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Unicom_Widget.JS
- http_request:
    name: 中国联通 App 自动捕获
    match: '^https://m\.clien[{{{cuCapture}}}]\.10010\.com/'
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Unicom_Widget.JS
mitm:
  hostnames:
    includes:
    - m.client.10010.com
widgets:
- name: china-unicom
